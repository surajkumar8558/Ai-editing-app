<!doctype html>
<!-- Text behind person, as a HyperFrames composition.
     render.mjs fills in {{WIDTH}}, {{HEIGHT}}, {{DURATION}}, {{BG_AUDIO}} from the input video and writes
     a job folder with index.html + assets/video.mp4 + assets/person.webm.
     Layers (z-index): 1 original video, 2 text, 3 person cut-out (VP9 WebM with alpha). -->
<html
  data-composition-variables='[
    {"id":"headline","type":"string","label":"Headline","default":"DREAM BIG"},
    {"id":"color","type":"color","label":"Text colour","default":"#FFD400"},
    {"id":"textY","type":"number","label":"Text position (% from top)","min":0,"max":100,"default":45}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/Anton-Regular.woff2") format("woff2");
      }
      html, body { margin: 0; background: #000; }
      #root { position: relative; overflow: hidden; }
      .layer { position: absolute; left: 0; top: 0; width: {{WIDTH}}px; height: {{HEIGHT}}px; object-fit: contain; }
      #headline-wrap {
        position: absolute; left: 0; width: 100%;
        top: calc(var(--textY) * 1%);
        display: flex; justify-content: center;
        z-index: 2;
      }
      #headline {
        font-family: "Anton", sans-serif;
        font-size: calc({{HEIGHT}}px * 0.26);
        line-height: 1;
        color: var(--color);
        white-space: nowrap;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}"
         data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
      <video id="bg" class="clip layer" src="assets/video.mp4" data-start="0" data-duration="{{DURATION}}"
             data-track-index="0" style="z-index: 1" playsinline {{BG_AUDIO}}></video>

      <div id="headline-wrap" data-layout-allow-overflow>
        <div id="headline" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="1"
             data-var-text="headline">DREAM BIG</div>
      </div>

      <video id="person" class="clip layer" src="assets/person.webm" data-start="0" data-duration="{{DURATION}}"
             data-track-index="2" style="z-index: 3" muted playsinline></video>
    </div>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#headline",
        { opacity: 0, y: 60, scale: 0.8 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
