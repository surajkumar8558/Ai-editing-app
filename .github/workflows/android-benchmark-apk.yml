name: Android APK (benchmark app)

on:
  push:
    paths:
      - 'apps/benchmark/**'
      - '.github/workflows/android-benchmark-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/benchmark
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/benchmark/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Release build: JS is bundled into the APK, so it runs without a computer.
      # Expo's template signs release builds with the debug key, which is fine for sideloading.
      # arm64-v8a only: covers every phone from the last ~8 years and keeps the APK small.
      - name: Build APK
        working-directory: apps/benchmark/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - uses: actions/upload-artifact@v4
        with:
          name: ai-editor-benchmark-apk
          path: apps/benchmark/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
